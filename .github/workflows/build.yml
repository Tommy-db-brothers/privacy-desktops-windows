name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeskVeil.sln

      - name: Build
        run: dotnet build DeskVeil.sln -c Release --no-restore

      - name: Test
        run: dotnet test DeskVeil.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/DeskVeil/DeskVeil.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish

      - name: Name the asset after the tag
        shell: pwsh
        run: Copy-Item publish/DeskVeil.exe "DeskVeil-${{ github.ref_name }}-win-x64.exe"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: DeskVeil-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true
